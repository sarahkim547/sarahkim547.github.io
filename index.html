<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secret Santa</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }

    .card {
      background: #ffffff;
      padding: 2rem 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 0.25rem;
      font-size: 1.5rem;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font-size: 1rem;
      border-radius: 0.75rem;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
    }

    button:hover {
      background: #1d4ed8;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .message {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      display: none;
    }

    .message.success {
      background: #ecfdf3;
      color: #166534;
      border: 1px solid #22c55e;
    }

    .message.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #f87171;
    }

    .small-note {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎅 Secret Santa 🎅</h1>
    <p class="subtitle">Enter your password to see who you’re buying for 🎁</p>

    <form id="secretSantaForm">
      <label for="passwordInput">Your password</label>
      <input
        type="text"
        id="passwordInput"
        name="password"
        placeholder="Type your password"
        autocomplete="off"
        required
      />
      <button type="submit">Reveal my person</button>
    </form>

    <div id="result" class="message"></div>

<!--     <p class="small-note">
       
    </p> -->
  </div>

  <script>

    const secretSantaAssignments = {
    "Sue" : "Hana",
    "Paul" : "Josephina",
    "Sarah" : "Isabella",
    "Matthew" : "Caleb",
    "Josephina" : "Paul",
    "Peter" : "Michael",
    "Alexandra" : "Isaac",
    "Isabella" : "Sonia",
    "Michael" : "Alexandra",
    "Hana" : "Peter",
    "Isaac" : "Sarah",
    "Caleb" : "Sue",
    "Sonia" : "Matthew"


    };

    const namePasswordMap = {
    "tallpark43" : "Sue",
    "lowcard84" : "Paul",
    "bestearth44" : "Sarah",
    "largegrape65" : "Matthew",
    "crazygiraffe30" : "Josephina",
    "wildisland99" : "Peter",
    "wiseworm73" : "Alexandra",
    "mushywire59" : "Isabella",
    "tallfrog59" : "Michael",
    "bumpymist98" : "Hana",
    "rapidmoney18" : "Isaac",
    "broadscarf42" : "Caleb",
    "leannoise27" : "Sonia"
    };
    // ================================================

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("secretSantaForm");
      const passwordInput = document.getElementById("passwordInput");
      const resultBox = document.getElementById("result");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        // const rawName = nameInput.value.trim();
        // const key = rawName.toLowerCase();

        const password = passwordInput.value.trim();

        if (!password) {
          showMessage("Please enter your password.", "error");
          return;
        }


        const giverName = namePasswordMap[password];
        const recipient = secretSantaAssignments[giverName];

        if (!giverName) {
          showMessage(
            "That password is not in the list.",
            "error"
          );
          return;
        }

        showMessage(
          "Hi " + giverName + "! You are the Secret Santa for: " + recipient + " 🎄",
          "success"
        );
      });

      function showMessage(text, type) {
        resultBox.textContent = text;
        resultBox.classList.remove("success", "error");
        resultBox.classList.add(type);
        resultBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
